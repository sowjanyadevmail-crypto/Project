<div class="form-container">
  <div class="glass-card">
    <h2 style="margin-bottom: 24px; color: var(--accent-primary);">{{isEditMode ? 'Edit Award Record' : 'Grant New Award'}}</h2>
    
    <form [formGroup]="awardForm" (ngSubmit)="onSubmit()">
      
      <!-- Student Details Section -->
      <h3 style="margin-top: 0; margin-bottom: 16px; border-bottom: 1px solid var(--surface-border); padding-bottom: 8px;">Student Details</h3>
      
      <div class="form-row">
        <div class="form-group half">
          <label class="form-label">First Name</label>
          <input type="text" formControlName="firstName" class="form-control" placeholder="Jane">
        </div>
        <div class="form-group half">
          <label class="form-label">Last Name</label>
          <input type="text" formControlName="lastName" class="form-control" placeholder="Doe">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label class="form-label">BSU ID</label>
          <input type="text" formControlName="bsuId" class="form-control" placeholder="BSU123456">
        </div>
        <div class="form-group half">
          <label class="form-label">BSU Email</label>
          <input type="email" formControlName="bsuEmail" class="form-control" placeholder="jdoe@bsu.edu">
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Personal Email</label>
        <input type="email" formControlName="personalEmail" class="form-control" placeholder="jane.doe@gmail.com">
      </div>

      <div class="form-row">
        <div class="form-group third">
          <label class="form-label">Gender</label>
          <select formControlName="gender" class="form-control">
            <option value="">Select...</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Non-Binary">Non-Binary</option>
            <option value="Prefer Not to Say">Prefer Not to Say</option>
          </select>
        </div>
        <div class="form-group third">
          <label class="form-label">Race</label>
          <select formControlName="race" class="form-control">
            <option value="">Select...</option>
            <option value="Asian">Asian</option>
            <option value="Black/African American">Black/African American</option>
            <option value="Hispanic/Latino">Hispanic/Latino</option>
            <option value="White">White</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group third">
          <label class="form-label">Program Type</label>
          <select formControlName="programType" class="form-control">
            <option value="">Select...</option>
            <option value="BSW">BSW</option>
            <option value="MSW">MSW</option>
          </select>
        </div>
      </div>

      <!-- Award Details Section -->
      <h3 style="margin-top: 24px; margin-bottom: 16px; border-bottom: 1px solid var(--surface-border); padding-bottom: 8px;">Award Details</h3>
      
      <div class="form-row">
        <div class="form-group half">
          <label class="form-label">Fund Category</label>
          <select formControlName="fundCategoryId" class="form-control" (change)="onFundChange($event)">
            <option value="">Select a fund...</option>
            <optgroup label="Klarman Funds">
              <option *ngFor="let f of funds" [value]="f.id" [style.display]="f.parentFund === 'Klarman' ? 'block' : 'none'">
                {{f.name}}
              </option>
            </optgroup>
            <optgroup label="MGB Funds">
              <option *ngFor="let f of funds" [value]="f.id" [style.display]="f.parentFund === 'MGB' ? 'block' : 'none'">
                {{f.name}}
              </option>
            </optgroup>
          </select>
        </div>
        <div class="form-group half">
          <label class="form-label">Amount Awarded ($)</label>
          <input type="number" formControlName="amountAwarded" class="form-control" placeholder="0.00">
        </div>
      </div>

      <div class="form-actions" style="margin-top: 30px; display: flex; justify-content: flex-end;">
        <button type="submit" class="btn btn-primary" [disabled]="!awardForm.valid">
          {{isEditMode ? 'Save Changes' : 'Submit Award'}}
        </button>
      </div>

    </form>
  </div>
</div>
